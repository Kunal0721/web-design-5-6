    <meta charset="UTF-8">

    <title>Document</title>

<body>
    <input type="text" id="password" placeholder="Enter password">
    <p id="result"></p>
    <script>
        let password = document.getElementById("password");
        let result = document.getElementById("result")
        let p = "";
        password.addEventListener("input", function(){
            let lower = /[a-z]/;
            let upper = /[A-Z]/
            let numbers = /\d/

            p = password.value;
            if(p.length >= 8){
                if(numbers.test(p)){
                    if(upper.test(p)){
                        result.innerHTML = "";
                    }
                    else{
                        result.innerHTML = "please enter the uppercase characters**";
                    }
                }
                else{
                    result.innerHTML = "please include the number**";
                }
            }
            else{
                result.innerHTML = "please enter the password more then 8 character";
                result.style.color= "crimson"
            }

        })
